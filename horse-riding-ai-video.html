<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI騎馬知識影片 - 20秒預覽</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: white;
  }
  h1 {
    font-size: 1.2rem;
    color: #88aaff;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .video-frame {
    width: 360px;
    height: 640px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    border: 2px solid #334;
    box-shadow: 0 0 40px rgba(100, 150, 255, 0.3);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .controls {
    margin-top: 16px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  button {
    background: #334;
    color: white;
    border: 1px solid #556;
    padding: 8px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s;
  }
  button:hover { background: #445; }
  .timer {
    font-size: 13px;
    color: #88aaff;
    font-variant-numeric: tabular-nums;
  }
  .progress-bar {
    width: 360px;
    height: 4px;
    background: #223;
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #6688ff, #aa66ff);
    border-radius: 2px;
    transition: width 0.1s linear;
    width: 0%;
  }
</style>
</head>
<body>
<h1>🐴 AI騎馬知識影片 20秒預覽</h1>
<div class="video-frame">
  <canvas id="c" width="360" height="640"></canvas>
</div>
<div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
<div class="controls">
  <button id="playBtn" onclick="togglePlay()">▶ 播放</button>
  <button onclick="restart()">↺ 重播</button>
  <span class="timer" id="timer">0.0s / 20.0s</span>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 360, H = 640;
const DURATION = 20000;

let startTime = null;
let elapsed = 0;
let animId = null;
let playing = false;

// Scenes (ms start, ms end, subtitle)
const scenes = [
  { start: 0,    end: 4000,  subtitle: "嘿！你知道什麼是人工智慧嗎？",      phase: "intro" },
  { start: 4000, end: 8000,  subtitle: "AI就像訓練有素的馬，\n學習模式、做出判斷",  phase: "explain" },
  { start: 8000, end: 12000, subtitle: "大型語言模型 (LLM)\n讀過幾乎整個網際網路！",   phase: "llm" },
  { start: 12000,end: 16000, subtitle: "它透過「提示詞」理解你的意圖\n然後生成回應",   phase: "prompt" },
  { start: 16000,end: 20000, subtitle: "AI是工具，不是魔法——\n善用它，人人都能起飛！🚀",  phase: "outro" },
];

function getScene(t) {
  return scenes.find(s => t >= s.start && t < s.end) || scenes[scenes.length-1];
}

// Sky colors per scene
const skyColors = {
  intro:   { top: "#1a0533", bot: "#3d1466" },
  explain: { top: "#0a1a3a", bot: "#1a3a6a" },
  llm:     { top: "#001a1a", bot: "#004040" },
  prompt:  { top: "#1a1a00", bot: "#404000" },
  outro:   { top: "#2a0a00", bot: "#6a2010" },
};

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function drawBackground(phase, localT) {
  const c = skyColors[phase];
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, c.top);
  g.addColorStop(1, c.bot);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

function drawGround(t) {
  // Ground
  const gg = ctx.createLinearGradient(0, H*0.65, 0, H);
  gg.addColorStop(0, "#3a5a20");
  gg.addColorStop(1, "#1a2a0a");
  ctx.fillStyle = gg;
  ctx.fillRect(0, H*0.65, W, H*0.35);

  // Rolling hills
  ctx.fillStyle = "#2a4a15";
  ctx.beginPath();
  ctx.moveTo(0, H*0.67);
  for (let x=0; x<=W; x+=5) {
    const y = H*0.65 + Math.sin((x+t*0.04)*0.03)*18 + Math.sin((x+t*0.02)*0.07)*8;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fill();

  // Ground scroll stripes
  ctx.strokeStyle = "rgba(100,160,50,0.2)";
  ctx.lineWidth = 1;
  for (let i=0; i<5; i++) {
    const xOff = ((t*2 + i*80) % W);
    ctx.beginPath();
    ctx.moveTo(xOff, H*0.7);
    ctx.lineTo(xOff - 40, H);
    ctx.stroke();
  }
}

function drawStars(phase, t) {
  const phases = ["intro","explain","llm"];
  if (!phases.includes(phase)) return;
  const positions = [
    [40,30],[80,60],[150,20],[220,45],[300,25],[330,80],[60,110],[280,90],[170,70],[240,15]
  ];
  positions.forEach(([x,y],i) => {
    const blink = 0.5 + 0.5*Math.sin(t*0.003 + i*1.3);
    ctx.fillStyle = `rgba(200,220,255,${blink*0.8})`;
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, Math.PI*2);
    ctx.fill();
  });
}

function drawMoon(phase, t) {
  if (!["intro","explain"].includes(phase)) return;
  const mx = 290 + Math.sin(t*0.0005)*5;
  const my = 60;
  ctx.fillStyle = "#fffde0";
  ctx.shadowColor = "#ffff88";
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(mx, my, 22, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#0a1a3a";
  ctx.beginPath();
  ctx.arc(mx+8, my-4, 18, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawSun(phase, t) {
  if (!["outro"].includes(phase)) return;
  const progress = t/DURATION;
  const sy = 150 - progress*60;
  const gradient = ctx.createRadialGradient(W/2, sy, 0, W/2, sy, 80);
  gradient.addColorStop(0, "rgba(255,220,100,1)");
  gradient.addColorStop(0.3, "rgba(255,160,50,0.8)");
  gradient.addColorStop(1, "rgba(255,80,20,0)");
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(W/2, sy, 80, 0, Math.PI*2);
  ctx.fill();
}

// Particles for LLM scene (floating data nodes)
function drawDataNodes(phase, t) {
  if (phase !== "llm" && phase !== "prompt") return;
  const nodes = [
    [60, 0.2], [120, 0.5], [180, 0.3], [240, 0.7], [300, 0.1],
    [90, 0.8], [210, 0.4], [270, 0.6]
  ];
  nodes.forEach(([x, offset], i) => {
    const y = 80 + Math.sin(t*0.002 + offset*6.28)*30 + i*30;
    const alpha = 0.3 + 0.4*Math.sin(t*0.003 + i);
    ctx.fillStyle = `rgba(100,200,255,${alpha})`;
    ctx.strokeStyle = `rgba(100,200,255,${alpha*0.5})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y % (H*0.6), 4, 0, Math.PI*2);
    ctx.fill();
    // Connect nearby nodes
    if (i > 0) {
      const [px, po] = nodes[i-1];
      const py = 80 + Math.sin(t*0.002 + po*6.28)*30 + (i-1)*30;
      ctx.beginPath();
      ctx.moveTo(x, y % (H*0.6));
      ctx.lineTo(px, py % (H*0.6));
      ctx.stroke();
    }
  });
}

// Horse body parts (simple vector art)
function drawHorse(t, bobY) {
  const cx = W/2;
  const cy = H*0.62 + bobY;
  const legCycle = t * 0.008;

  // Shadow
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath();
  ctx.ellipse(cx, H*0.68, 70, 10, 0, 0, Math.PI*2);
  ctx.fill();

  // Body
  ctx.fillStyle = "#6b3a1f";
  ctx.beginPath();
  ctx.ellipse(cx, cy, 75, 42, 0.1, 0, Math.PI*2);
  ctx.fill();

  // Neck
  ctx.fillStyle = "#6b3a1f";
  ctx.beginPath();
  ctx.moveTo(cx+40, cy-20);
  ctx.quadraticCurveTo(cx+70, cy-60, cx+65, cy-90);
  ctx.lineTo(cx+50, cy-85);
  ctx.quadraticCurveTo(cx+55, cy-55, cx+25, cy-15);
  ctx.closePath();
  ctx.fill();

  // Head
  ctx.fillStyle = "#7a4425";
  ctx.beginPath();
  ctx.ellipse(cx+72, cy-95, 22, 15, -0.3, 0, Math.PI*2);
  ctx.fill();

  // Muzzle
  ctx.fillStyle = "#8a5435";
  ctx.beginPath();
  ctx.ellipse(cx+88, cy-98, 10, 7, 0.2, 0, Math.PI*2);
  ctx.fill();

  // Eye
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(cx+77, cy-103, 3.5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(cx+78, cy-104, 1.2, 0, Math.PI*2);
  ctx.fill();

  // Ear
  ctx.fillStyle = "#6b3a1f";
  ctx.beginPath();
  ctx.moveTo(cx+65, cy-106);
  ctx.lineTo(cx+60, cy-120);
  ctx.lineTo(cx+72, cy-112);
  ctx.closePath();
  ctx.fill();

  // Mane
  ctx.fillStyle = "#3a1a00";
  for (let i=0; i<5; i++) {
    const mx = cx + 45 + i*5;
    const my = cy - 75 - i*6;
    const wave = Math.sin(legCycle + i) * 4;
    ctx.beginPath();
    ctx.ellipse(mx+wave, my, 5, 12, -0.5, 0, Math.PI*2);
    ctx.fill();
  }

  // Legs
  const legs = [
    { x: cx-40, phase: 0 },
    { x: cx-15, phase: Math.PI },
    { x: cx+15, phase: Math.PI*0.5 },
    { x: cx+40, phase: Math.PI*1.5 },
  ];
  legs.forEach(leg => {
    const swing = Math.sin(legCycle + leg.phase) * 15;
    const knee = Math.abs(Math.sin(legCycle + leg.phase)) * 10;
    ctx.strokeStyle = "#5a2a0f";
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(leg.x, cy+35);
    ctx.lineTo(leg.x + swing*0.4, cy+60 - knee);
    ctx.lineTo(leg.x + swing, cy+90);
    ctx.stroke();
    // Hoof
    ctx.fillStyle = "#2a1a00";
    ctx.beginPath();
    ctx.ellipse(leg.x + swing, cy+92, 7, 4, 0, 0, Math.PI*2);
    ctx.fill();
  });

  // Tail
  ctx.strokeStyle = "#3a1a00";
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(cx-70, cy-10);
  for (let i=1; i<=8; i++) {
    const tx = cx - 70 - i*6;
    const ty = cy - 10 + i*8 + Math.sin(legCycle + i*0.5)*8;
    ctx.lineTo(tx, ty);
  }
  ctx.stroke();
}

function drawRider(t, bobY) {
  const cx = W/2;
  const cy = H*0.62 + bobY;
  const sway = Math.sin(t*0.008)*3;

  // Torso (puffer jacket - dark navy)
  ctx.fillStyle = "#1a2540";
  ctx.beginPath();
  ctx.ellipse(cx+sway, cy-65, 22, 28, 0, 0, Math.PI*2);
  ctx.fill();

  // Red jacket accent
  ctx.fillStyle = "#cc3344";
  ctx.fillRect(cx-3+sway, cy-90, 6, 28);

  // Arms holding reins
  ctx.strokeStyle = "#1a2540";
  ctx.lineWidth = 10;
  ctx.lineCap = "round";
  // Left arm
  ctx.beginPath();
  ctx.moveTo(cx-15+sway, cy-65);
  ctx.quadraticCurveTo(cx-30+sway, cy-50, cx+40, cy-70);
  ctx.stroke();
  // Right arm
  ctx.beginPath();
  ctx.moveTo(cx+15+sway, cy-65);
  ctx.quadraticCurveTo(cx+30+sway, cy-50, cx+50, cy-68);
  ctx.stroke();

  // Head (face)
  ctx.fillStyle = "#f0c89a";
  ctx.beginPath();
  ctx.arc(cx+sway, cy-100, 18, 0, Math.PI*2);
  ctx.fill();

  // Glasses
  ctx.strokeStyle = "#8a6a30";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx-6+sway, cy-101, 7, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx+7+sway, cy-101, 7, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx-13+sway, cy-101);
  ctx.lineTo(cx-15+sway, cy-101);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx+14+sway, cy-101);
  ctx.lineTo(cx+16+sway, cy-101);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx+1+sway, cy-101);
  ctx.lineTo(cx-0+sway, cy-101);
  ctx.stroke();

  // Eyes (behind glasses)
  ctx.fillStyle = "#333";
  ctx.beginPath();
  ctx.arc(cx-6+sway, cy-102, 2.5, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx+7+sway, cy-102, 2.5, 0, Math.PI*2);
  ctx.fill();

  // Smile
  ctx.strokeStyle = "#c07050";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx+sway, cy-94, 6, 0.2, Math.PI-0.2);
  ctx.stroke();

  // Hat (knit beanie)
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.ellipse(cx+sway, cy-115, 18, 8, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#333";
  ctx.beginPath();
  ctx.ellipse(cx+sway, cy-118, 16, 14, 0, Math.PI, Math.PI*2);
  ctx.fill();
  // Hat pattern (houndstooth-ish stripes)
  ctx.strokeStyle = "#555";
  ctx.lineWidth = 1;
  for (let i=-2; i<=2; i++) {
    ctx.beginPath();
    ctx.moveTo(cx-14+i*5+sway, cy-132);
    ctx.lineTo(cx-14+i*5+4+sway, cy-118);
    ctx.stroke();
  }

  // Hair (brown, peeking under hat)
  ctx.fillStyle = "#7a4a20";
  ctx.beginPath();
  ctx.ellipse(cx+sway, cy-113, 17, 5, 0, 0, Math.PI);
  ctx.fill();

  // Bag strap (brown diagonal)
  ctx.strokeStyle = "#8b5e3c";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx+15+sway, cy-82);
  ctx.lineTo(cx-15+sway, cy-45);
  ctx.stroke();
}

function drawReins(t) {
  const cx = W/2;
  const cy = H*0.62;
  ctx.strokeStyle = "#4a3a20";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx+40, cy-50);
  ctx.quadraticCurveTo(cx+55, cy-60, cx+75, cy-75);
  ctx.stroke();
}

function drawSubtitle(text, localT, totalDur) {
  const fadeIn = clamp(localT / 400, 0, 1);
  const fadeOut = clamp((totalDur - localT) / 400, 0, 1);
  const alpha = Math.min(fadeIn, fadeOut);

  ctx.save();
  ctx.globalAlpha = alpha;

  // Subtitle box
  const lines = text.split('\n');
  const fontSize = 18;
  ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
  const maxW = lines.reduce((m, l) => Math.max(m, ctx.measureText(l).width), 0);
  const boxW = maxW + 40;
  const boxH = lines.length * (fontSize + 8) + 20;
  const boxX = (W - boxW) / 2;
  const boxY = H - boxH - 30;

  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.beginPath();
  ctx.roundRect(boxX, boxY, boxW, boxH, 10);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  lines.forEach((line, i) => {
    ctx.fillText(line, W/2, boxY + 18 + i*(fontSize+8));
  });

  ctx.restore();
}

function drawAIOverlay(phase, t) {
  if (phase === "llm") {
    // Floating words
    const words = ["Neural Net", "GPT", "Tokens", "Training", "Weights", "Attention"];
    words.forEach((w, i) => {
      const x = 30 + (i%3)*110;
      const y = 120 + Math.floor(i/3)*60 + Math.sin(t*0.002 + i)*10;
      const alpha = 0.4 + 0.3*Math.sin(t*0.004 + i*0.8);
      ctx.fillStyle = `rgba(100,220,200,${alpha})`;
      ctx.font = "12px monospace";
      ctx.textAlign = "left";
      ctx.fillText(w, x, y);
    });
  }
  if (phase === "prompt") {
    // Prompt box animation
    const typeLen = Math.floor((t % 3000) / 60);
    const promptText = "你好！請解釋AI".substring(0, typeLen);
    ctx.fillStyle = "rgba(20,30,50,0.8)";
    ctx.beginPath();
    ctx.roundRect(20, 100, 320, 45, 8);
    ctx.fill();
    ctx.strokeStyle = "#3355aa";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#88ccff";
    ctx.font = "13px monospace";
    ctx.textAlign = "left";
    ctx.fillText(`> ${promptText}█`, 32, 128);
  }
}

function drawHUD(t) {
  // Time counter
  const sec = (t/1000).toFixed(1);
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.beginPath();
  ctx.roundRect(10, 10, 80, 24, 6);
  ctx.fill();
  ctx.fillStyle = "#88aaff";
  ctx.font = "12px monospace";
  ctx.textAlign = "left";
  ctx.fillText(`⏱ ${sec}s`, 18, 27);

  // REC indicator
  const blink = Math.sin(t*0.006) > 0;
  if (blink) {
    ctx.fillStyle = "#ff3333";
    ctx.beginPath();
    ctx.arc(W-25, 22, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "white";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("REC", W-35, 26);
  }
}

function draw(ts) {
  if (!startTime) startTime = ts;
  elapsed = ts - startTime;
  if (elapsed >= DURATION) {
    elapsed = DURATION;
    playing = false;
    document.getElementById('playBtn').textContent = '▶ 重播';
  }

  const t = elapsed;
  const bobY = Math.sin(t * 0.012) * 6;
  const scene = getScene(t);
  const localT = t - scene.start;
  const sceneDur = scene.end - scene.start;

  // Draw
  drawBackground(scene.phase, localT);
  drawStars(scene.phase, t);
  drawMoon(scene.phase, t);
  drawSun(scene.phase, t);
  drawDataNodes(scene.phase, t);
  drawGround(t);
  drawHorse(t, bobY);
  drawReins(t);
  drawRider(t, bobY);
  drawAIOverlay(scene.phase, t);
  drawSubtitle(scene.subtitle, localT, sceneDur);
  drawHUD(t);

  // Update UI
  document.getElementById('timer').textContent = `${(t/1000).toFixed(1)}s / 20.0s`;
  document.getElementById('prog').style.width = `${(t/DURATION)*100}%`;

  if (playing && elapsed < DURATION) {
    animId = requestAnimationFrame(draw);
  }
}

function togglePlay() {
  if (elapsed >= DURATION) { restart(); return; }
  if (playing) {
    playing = false;
    cancelAnimationFrame(animId);
    document.getElementById('playBtn').textContent = '▶ 繼續';
  } else {
    playing = true;
    document.getElementById('playBtn').textContent = '⏸ 暫停';
    const offset = elapsed;
    startTime = null;
    requestAnimationFrame(ts => {
      startTime = ts - offset;
      animId = requestAnimationFrame(draw);
    });
  }
}

function restart() {
  cancelAnimationFrame(animId);
  elapsed = 0;
  startTime = null;
  playing = true;
  document.getElementById('playBtn').textContent = '⏸ 暫停';
  animId = requestAnimationFrame(draw);
}

// Draw first frame
requestAnimationFrame(ts => { startTime = ts; draw(ts); startTime = null; });
</script>
</body>
</html>
